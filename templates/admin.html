<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manage users · Vision Suite</title>
__THEME_SCRIPT__
<style>
__THEME__
  html,body{margin:0;min-height:100%;}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:2px;font-size:13px;color:var(--text);}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .spacer{flex:1;}
  .wrap{max-width:640px;margin:0 auto;padding:30px 22px 60px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:650;display:flex;align-items:center;gap:11px;}
  h1::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--accent);}
  .sub{color:var(--text-muted);margin:0 0 24px;font-size:13.5px;}
  .addrow{display:flex;gap:8px;margin-bottom:22px;}
  .addrow input{flex:1;height:40px;padding:9px 12px;font-size:14px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border-2);border-radius:var(--r);}
  .addrow input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);}
  .addrow button{height:40px;padding:0 18px;font-weight:600;color:var(--accent-fg);background:var(--accent);
    border:none;border-radius:var(--r);cursor:pointer;}
  .addrow button:hover{background:var(--accent-hover);}
  .msg{font-size:13px;border-radius:var(--r);padding:9px 12px;margin-bottom:18px;}
  .msg.ok{background:var(--ok-soft);color:var(--ok);}
  .msg.err{background:var(--danger-soft);color:var(--danger-fg);border:1px solid var(--danger-border);}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);
    font-weight:600;padding:0 0 10px;border-bottom:1px solid var(--border);}
  td{padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text);}
  td.act{text-align:right;}
  .tag{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-left:8px;}
  .rm{font-size:12.5px;color:var(--danger);background:var(--danger-soft);border:1px solid var(--danger-border);
    border-radius:var(--r);padding:6px 12px;cursor:pointer;}
  .rm:hover{filter:brightness(1.05);}
  .empty{color:var(--text-muted);font-size:13.5px;padding:18px 0;}
  form.inline{display:inline;}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>VISION SUITE</div>
    <div class="spacer"></div>
    <a class="home-btn" href="/" title="Back to the suite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>Suite</a>
    __THEME_BUTTON__
  </header>
  <div class="wrap">
    <h1>Manage users</h1>
    <p class="sub">Add a user with an email and a password — they sign in with those. No invitation is sent. Re-adding an existing email just resets their password. Remove a user to revoke access immediately.</p>

    __MSG__

    <form class="addrow" method="post" action="/admin/users/add">
      <input name="email" type="email" placeholder="person@company.com" autocomplete="off" required />
      <input name="password" type="password" placeholder="Set a password" autocomplete="new-password" required />
      <button type="submit">Save</button>
    </form>

    <table>
      <thead><tr><th>Email</th><th></th></tr></thead>
      <tbody>
        __ROWS__
      </tbody>
    </table>
  </div>
<script>
__THEME_JS__
</script>
</body>
</html>
