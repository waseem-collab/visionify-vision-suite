<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Vision Suite</title>
__THEME_SCRIPT__
<style>
__THEME__
  html,body{margin:0;min-height:100%;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .corner{position:absolute;top:18px;right:18px;}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:30px 28px;}
  .logo{width:52px;height:52px;border-radius:14px;display:block;margin:0 0 18px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:650;}
  .sub{color:var(--text-muted);font-size:13.5px;margin:0 0 22px;}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);
    font-weight:600;margin:0 0 6px;}
  input{width:100%;height:40px;padding:9px 12px;font-size:14px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border-2);border-radius:var(--r);margin-bottom:14px;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);}
  .btn{width:100%;height:42px;font-size:14px;font-weight:600;color:var(--accent-fg);background:var(--accent);
    border:none;border-radius:var(--r);cursor:pointer;transition:background .14s;}
  .btn:hover{background:var(--accent-hover);}
  .err{background:var(--danger-soft);border:1px solid var(--danger-border);color:var(--danger-fg);
    font-size:13px;border-radius:var(--r);padding:9px 12px;margin:0 0 18px;}
  .divider{display:flex;align-items:center;gap:12px;color:var(--text-dim);font-size:12px;margin:20px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:42px;
    font-size:14px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border-2);
    border-radius:var(--r);cursor:pointer;text-decoration:none;transition:border-color .14s,background .14s;}
  .google:hover{border-color:var(--accent);background:var(--surface-2);}
  .google svg{width:18px;height:18px;flex:0 0 auto;}
  .google.off{opacity:.55;cursor:not-allowed;}
  .note{font-size:12px;color:var(--text-dim);text-align:center;margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
  <div class="corner">__THEME_BUTTON__</div>
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><g stroke="#0a0a0a" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".88"><path d="M16 25v-7a2 2 0 0 1 2-2h7"/><path d="M48 25v-7a2 2 0 0 0-2-2h-7"/><path d="M16 39v7a2 2 0 0 0 2 2h7"/><path d="M48 39v7a2 2 0 0 1-2 2h-7"/></g><circle cx="32" cy="32" r="4.6" fill="#0a0a0a"/></svg>
    <h1>Sign in to Vision Suite</h1>
    <p class="sub">Access is limited to approved accounts.</p>

    __ERROR__

    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      <button class="btn" type="submit">Sign in</button>
    </form>

    <div class="divider">or</div>
    __GOOGLE__
  </div>
<script>
__THEME_JS__
</script>
</body>
</html>
